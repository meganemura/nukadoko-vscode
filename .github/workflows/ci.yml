# Actions are pinned to commit ids rather than tags, with the version beside
# them so the line stays readable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back. An injected workflow is limited by what
# its token may do, so the token is given only what this one needs.
permissions:
  contents: read

# A superseded run has nothing left to tell anyone.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` is also set by .npmrc. It is written here too
      # because the line is where a reader looks.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run package
